<script>
(function(){
var SK='dgg_clave_oro';
var P=JSON.parse(document.getElementById('payload').textContent);
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function get(){try{return localStorage.getItem(SK);}catch(e){return null;}}
function set(v){try{localStorage.setItem(SK,v);}catch(e){}}
function del(){try{localStorage.removeItem(SK);}catch(e){}}
async function open(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
function show(h){document.open();document.write(h);document.close();}
var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),b=document.getElementById('b');
f.addEventListener('submit',function(e){e.preventDefault();var v=pw.value.trim();if(!v)return;b.disabled=true;err.textContent='Comprobando…';
  open(v).then(function(h){set(v);show(h);},function(){err.textContent='Clave incorrecta. Revisa la clave de este mes en Skool.';b.disabled=false;});});
var saved=get();
if(saved){document.getElementById('gate').style.visibility='hidden';
  open(saved).then(show,function(){del();document.getElementById('gate').style.visibility='visible';document.getElementById('msg').textContent='La clave ha cambiado este mes. Encuentra la nueva clave dentro de la comunidad de Grano de Oro en Skool.';});}
})();
</script></body></html>
